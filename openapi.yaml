  /api/v1/datasets/{datasetId}/publication-status:
    get:
      tags:
      - DCAT-datasets
      summary: Haal de publicatiestatus van een DCAT-dataset op
      description: "Geeft de publicatiestatus terug. Deze status hoort niet bij DCAT,\
        \ maar bij het record in deze API. Een dataset die je niet mag zien, geeft\
        \ 404."
      operationId: getDcatDatasetPublicationStatus
      parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: De publicatiestatus is opgehaald.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcatDatasetMeta"
              examples:
                Publicatiestatus:
                  summary: Gepubliceerde dataset
                  description: Publicatiestatus
                  value:
                    publicationStatus: PUBLISHED
                    allowedPublicationStatuses:
                    - WITHDRAWN
                    publishedAt: 2026-01-22T10:30:00Z
        "404":
          description: Een resource uit het pad bestaat niet. 'code' geeft aan welke.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "500":
          description: Een onverwachte fout aan serverzijde; 'code' is INTERNAL_ERROR.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
    put:
      tags:
      - DCAT-datasets
      summary: Wijzig de publicatiestatus van een DCAT-dataset
      description: "Zet de publicatiestatus op de meegestuurde waarde. Toegestaan:\
        \ DRAFT naar PUBLISHED, PUBLISHED naar WITHDRAWN en WITHDRAWN naar PUBLISHED.\
        \ De huidige status meesturen verandert niets."
      operationId: changeDcatDatasetPublicationStatus
      parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DcatDatasetPublicationStatusRequest"
        required: true
      responses:
        "200":
          description: De publicatiestatus is gewijzigd of was al de opgegeven waarde.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcatDatasetMeta"
              examples:
                IngetrokkenDataset:
                  summary: Ingetrokken dataset
                  description: IngetrokkenDataset
                  value:
                    publicationStatus: WITHDRAWN
                    allowedPublicationStatuses:
                    - PUBLISHED
                    publishedAt: 2026-01-22T10:30:00Z
        "409":
          description: De dataset kan niet naar de gevraagde status.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              examples:
                OngeldigeOvergang:
                  summary: DRAFT naar WITHDRAWN
                  description: OngeldigeOvergang
                  value:
                    type: urn:datastore:problem:dcat-dataset-invalid-publication-transition
                    title: Ongeldige publicatiestatusovergang
                    status: 409
                    detail: Dataset 5aa4d627-2b5a-4b69-b8e9-7af31d1288ee kan niet
                      overgaan van DRAFT naar WITHDRAWN
                    instance: /api/v1/datasets/5aa4d627-2b5a-4b69-b8e9-7af31d1288ee/publication-status
                    code: DCAT_DATASET_INVALID_PUBLICATION_TRANSITION
        "400":
          description: De request body is ongeldig of onvolledig.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "401":
          description: Geen geldige sessiecookie of bearer-token. Geen response body.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
        "403":
          description: "De rol User of Admin ontbreekt (geen response body), of de\
            \ dataset hoort bij een andere organisatie."
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "404":
          description: Een resource uit het pad bestaat niet. 'code' geeft aan welke.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "500":
          description: Een onverwachte fout aan serverzijde; 'code' is INTERNAL_ERROR.
