              schema:
                $ref: "#/components/schemas/ProblemResponse"
    post:
      tags:
      - DCAT-datasets
      summary: Valideer en bewaar een DCAT-datasetpayload
      description: |
        Controleert een DCAT-datasetpayload en slaat die op. Is de payload geldig, dan krijg je een nieuwe dataset-id terug.
        Is de payload ongeldig, dan bevat de response een foutcode en een lijst met fouten per veld.
        Bestaat er al een dataset met dezelfde dctIdentifier, dan geeft de API 409.

        Standaard slaat de API de dataset op als concept (DRAFT). Geef 'publicationStatus=PUBLISHED' mee om direct te publiceren.

        Tips voor clients:
        - Gebruik 'errors[*].code' om op een fout te reageren.
        - Gebruik 'errors[*].path' om een fout bij het juiste veld te tonen.
        - Toon 'errors[*].message' alleen; lees die niet uit in code.
        - Zie GET /api/v1/error-codes voor alle foutcodes.
      operationId: validateDcatDataset
      parameters:
      - name: publicationStatus
        in: query
        description: De status waarmee de dataset wordt opgeslagen. Standaard DRAFT;
          PUBLISHED publiceert direct.
        required: false
        schema:
          type: string
          default: DRAFT
          enum:
          - DRAFT
          - PUBLISHED
          - WITHDRAWN
      requestBody:
        description: DCAT-datasetpayload die gevalideerd en opgeslagen moet worden.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DcatDataset"
            examples:
              GeldigeRequestPayload:
                description: GeldigeRequestPayload
                value:
                  dctIdentifier: https://erasmuspark.org/datasets/plant-species/simple
                  dctTitle:
                  - Erasmuspark Plant Species
                  dctDescription:
                  - "Dataset with observed plant species in Erasmuspark, including\
                    \ species name and observation frequency."
                  dctAccrualPeriodicity: http://publications.europa.eu/resource/authority/frequency/DAILY
                  admsIdentifier:
                  - ERASMUSPARK-PLANTS-SIMPLE
                  dcatKeyword:
                  - flora
                  - plant species
                  dcatTheme:
                  - http://publications.europa.eu/resource/authority/data-theme/ENVI
                  dctType: http://publications.europa.eu/resource/authority/dataset-type/TEST_DATA
                  dcatVersion: 1.2.0
                  admsVersionNotes:
                  - Metadata field alignment with April 2026 profile.
                  dctPublisher:
                    foafName:
                    - Erasmuspark
                  dctCreator:
                  - foafName:
                    - Erasmuspark
                  dcatContactPoint:
                    vcardFn: Erasmuspark Data Team
                    vcardHasEmail: mailto:info@erasmuspark.org
                    vcardHasUrl: https://erasmuspark.org/contact
                  dctAccessRights: http://publications.europa.eu/resource/authority/access-right/PUBLIC
                  admsStatus: http://publications.europa.eu/resource/authority/dataset-status/AVAILABLE
                  dctIssued: 2026-01-22T00:00:00Z
                  dctModified: 2026-01-22T00:00:00Z
                  dcatDistribution:
                  - dcatAccessUrl: https://erasmuspark.org/datasets/plant-species/distributions/csv
                    dcatDownloadUrl: https://erasmuspark.org/datasets/plant-species/distributions/csv/download
                    dctTitle:
                    - CSV distribution
                    dctDescription:
                    - CSV export of observed plant species in Erasmuspark.
                    dctFormat: https://www.iana.org/assignments/media-types/text/csv
                  dcatHasVersion:
                  - https://erasmuspark.org/datasets/plant-species/simp/versions/1.1.0
                  dcatInSeries:
                  - https://erasmuspark.org/datasets/plant-series
                  dctIsReferencedBy:
                  - https://erasmuspark.org/reports/biodiversity-2024
                  dctProvenance:
                  - https://erasmuspark.org/provenance/plant-observations
                  provQualifiedAttribution:
                  - provAgent: https://erasmuspark.org/agents/plant-volunteers
                    provHadRole: http://standards.iso.org/iso/19115/resources/Codelists/cat/codelists.xml#CI_RoleCode_custodian
                  dcatQualifiedRelation:
                  - https://erasmuspark.org/relations/plant-species-related
                  dctRelation:
                  - https://erasmuspark.org/datasets/plant-observations
                  dctSource:
                  - https://erasmuspark.org/source/plant-survey
                  dcatSpatialResolutionInMeters: 25.5
                  dctSpatial:
                  - dctLocation: http://publications.europa.eu/resource/authority/country/NLD
                    dcatCentroid: POINT (4.8489782 52.3746254)
                  dctTemporal:
                  - dcatStartDate: 2024-01-01
                    dcatEndDate: 2024-12-31
                    timeHasBeginning: 2024-01-01T00:00:00Z
                    timeHasEnd: 2024-12-31T23:59:59Z
                  dcatTemporalResolution: P1D
                  admsSample:
                  - dcatAccessUrl: https://erasmuspark.org/datasets/plant-species/distributions/sample-csv
                    dcatDownloadUrl: https://erasmuspark.org/datasets/plant-species/distributions/sample-csv/download
                    dctTitle:
                    - Sample CSV distribution
                    dctDescription:
                    - Sample export with a subset of the plant species observations.
                    dctFormat: https://www.iana.org/assignments/media-types/text/csv
                  provWasGeneratedBy:
                  - https://erasmuspark.org/activities/plant-sync
        required: true
      responses:
        "201":
          description: De DCAT-payload is geldig en opgeslagen.
          headers:
            Location:
              description: URI van de aangemaakte datasetresource.
              style: simple
              schema:
                type: string
                format: uri
                example: /api/v1/datasets/5aa4d627-2b5a-4b69-b8e9-7af31d1288ee
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcatDatasetStoredResponse"
              examples:
