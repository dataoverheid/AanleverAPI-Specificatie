                  summary: Aangemaakte dataset
                  description: GeldigePayload
                  value:
                    id: 5aa4d627-2b5a-4b69-b8e9-7af31d1288ee
                    dctIdentifier: https://erasmuspark.org/datasets/plant-species/simple
        "409":
          description: "Er bestaat al een dataset met dezelfde dctIdentifier, of de\
            \ opgegeven publicationStatus is geen geldige beginstatus."
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
