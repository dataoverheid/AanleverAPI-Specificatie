openapi: 3.1.0
info:
  title: Datastore API
  description: REST API voor de datastore.
  contact:
    name: Data Overheid Nederland
    url: https://data.overheid.nl
    email: opendata@overheid.nl
  version: 0.9.0
servers:
- url: /
  description: Basis-URL van deze API.
tags:
- name: DCAT-catalog-records
  description: Catalog-records van de ingelogde gebruiker of van de organisatie.
- name: DCAT-distributies
  description: De distributies van een DCAT-dataset.
- name: DCAT-datasets
  description: Opgeslagen DCAT-datasets en hun publicatiestatus.
- name: Foutcodes
  description: De foutcodes die deze API kan teruggeven.
- name: Authenticatie
  description: "Inloggen, uitloggen en tokens."
paths:
  /api/v1/datasets/{datasetId}:
    get:
      tags:
      - DCAT-datasets
      summary: Haal een opgeslagen DCAT-dataset op
      description: "Geeft een opgeslagen DCAT-dataset terug. Zonder authenticatie\
        \ zijn alleen gepubliceerde datasets zichtbaar. Met rol User zie je daarnaast\
        \ de datasets van je eigen organisatie, met rol Admin alle datasets. Een dataset\
        \ die je niet mag zien, geeft 404."
      operationId: getDcatDataset
      parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: De opgevraagde dataset is gevonden.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcatDatasetResponse"
        "404":
          description: Een resource uit het pad bestaat niet. 'code' geeft aan welke.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "500":
          description: Een onverwachte fout aan serverzijde; 'code' is INTERNAL_ERROR.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
    put:
      tags:
      - DCAT-datasets
      summary: Vervang een opgeslagen DCAT-dataset
      description: Vervangt de hele opgeslagen DCAT-dataset.
      operationId: replaceDcatDataset
      parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Volledige DCAT-datasetpayload die de bestaande dataset vervangt.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DcatDataset"
            examples:
              VervangendeRequestPayload:
                description: VervangendeRequestPayload
                value:
                  dctIdentifier: https://erasmuspark.org/datasets/plant-species/simple
                  dctTitle:
                  - Erasmuspark Plant Species
                  dctDescription:
                  - "Dataset with observed plant species in Erasmuspark, including\
                    \ species name and observation frequency."
                  dctAccrualPeriodicity: http://publications.europa.eu/resource/authority/frequency/DAILY
                  admsIdentifier:
                  - ERASMUSPARK-PLANTS-SIMPLE
                  dcatKeyword:
                  - flora
                  - plant species
                  dcatTheme:
                  - http://publications.europa.eu/resource/authority/data-theme/ENVI
                  dctType: http://publications.europa.eu/resource/authority/dataset-type/TEST_DATA
                  dcatVersion: 1.2.0
                  admsVersionNotes:
                  - Metadata field alignment with April 2026 profile.
                  dctPublisher:
                    foafName:
                    - Erasmuspark
                  dctCreator:
                  - foafName:
                    - Erasmuspark
                  dcatContactPoint:
                    vcardFn: Erasmuspark Data Team
                    vcardHasEmail: mailto:info@erasmuspark.org
                    vcardHasUrl: https://erasmuspark.org/contact
                  dctAccessRights: http://publications.europa.eu/resource/authority/access-right/PUBLIC
                  admsStatus: http://publications.europa.eu/resource/authority/dataset-status/AVAILABLE
                  dctIssued: 2026-01-22T00:00:00Z
                  dctModified: 2026-01-22T00:00:00Z
                  dcatDistribution:
                  - dcatAccessUrl: https://erasmuspark.org/datasets/plant-species/distributions/csv
                    dcatDownloadUrl: https://erasmuspark.org/datasets/plant-species/distributions/csv/download
                    dctTitle:
                    - CSV distribution
                    dctDescription:
                    - CSV export of observed plant species in Erasmuspark.
                    dctFormat: https://www.iana.org/assignments/media-types/text/csv
                  dcatHasVersion:
                  - https://erasmuspark.org/datasets/plant-species/simp/versions/1.1.0
                  dcatInSeries:
                  - https://erasmuspark.org/datasets/plant-series
                  dctIsReferencedBy:
                  - https://erasmuspark.org/reports/biodiversity-2024
                  dctProvenance:
                  - https://erasmuspark.org/provenance/plant-observations
                  provQualifiedAttribution:
                  - provAgent: https://erasmuspark.org/agents/plant-volunteers
                    provHadRole: http://standards.iso.org/iso/19115/resources/Codelists/cat/codelists.xml#CI_RoleCode_custodian
                  dcatQualifiedRelation:
                  - https://erasmuspark.org/relations/plant-species-related
                  dctRelation:
                  - https://erasmuspark.org/datasets/plant-observations
                  dctSource:
                  - https://erasmuspark.org/source/plant-survey
                  dcatSpatialResolutionInMeters: 25.5
                  dctSpatial:
                  - dctLocation: http://publications.europa.eu/resource/authority/country/NLD
                    dcatCentroid: POINT (4.8489782 52.3746254)
                  dctTemporal:
                  - dcatStartDate: 2024-01-01
                    dcatEndDate: 2024-12-31
                    timeHasBeginning: 2024-01-01T00:00:00Z
                    timeHasEnd: 2024-12-31T23:59:59Z
                  dcatTemporalResolution: P1D
                  admsSample:
                  - dcatAccessUrl: https://erasmuspark.org/datasets/plant-species/distributions/sample-csv
                    dcatDownloadUrl: https://erasmuspark.org/datasets/plant-species/distributions/sample-csv/download
                    dctTitle:
                    - Sample CSV distribution
                    dctDescription:
                    - Sample export with a subset of the plant species observations.
                    dctFormat: https://www.iana.org/assignments/media-types/text/csv
                  provWasGeneratedBy:
                  - https://erasmuspark.org/activities/plant-sync
        required: true
      responses:
        "200":
          description: De dataset is vervangen.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcatDatasetStoredResponse"
        "400":
          description: De DCAT-payload is ongeldig of kon niet worden gelezen.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/DcatDatasetPayloadValidationProblemResponse"
                - $ref: "#/components/schemas/ProblemResponse"
              examples:
                ValidatieFoutTitel:
                  summary: Titelvalidatie faalt
                  description: ValidatieFoutTitel
                  value:
                    type: urn:datastore:problem:dcat-dataset-validation-failed
                    title: DCAT-payloadvalidatie is mislukt
                    status: 400
                    detail: De DCAT-datasetpayload is ongeldig
                    instance: /api/v1/datasets
                    code: DCAT_DATASET_VALIDATION_FAILED
                    errors:
                    - code: REQUIRED_FIELD
                      path: dctTitle
                      message: ongeldige waarde
                ValidatieFoutThema:
                  summary: Themavalidatie faalt
                  description: ValidatieFoutThema
                  value:
                    type: urn:datastore:problem:dcat-dataset-validation-failed
                    title: DCAT-payloadvalidatie is mislukt
                    status: 400
                    detail: De DCAT-datasetpayload is ongeldig
                    instance: /api/v1/datasets
                    code: DCAT_DATASET_VALIDATION_FAILED
                    errors:
                    - code: REQUIRED_FIELD
                      path: dcatTheme
                      message: ongeldige waarde
                ValidatieFoutBeschrijving:
                  summary: Beschrijvingvalidatie faalt
                  description: ValidatieFoutBeschrijving
                  value:
                    type: urn:datastore:problem:dcat-dataset-validation-failed
                    title: DCAT-payloadvalidatie is mislukt
                    status: 400
                    detail: De DCAT-datasetpayload is ongeldig
                    instance: /api/v1/datasets
                    code: DCAT_DATASET_VALIDATION_FAILED
                    errors:
                    - code: REQUIRED_FIELD
                      path: dctDescription
                      message: ongeldige waarde
                DeserialisatieFout:
                  summary: Ongeldige JSON
                  description: DeserialisatieFout
                  value:
                    type: urn:datastore:problem:dcat-dataset-deserialization-failed
                    title: DCAT-payload kon niet worden geparsed
                    status: 400
                    detail: De DCAT-datasetpayload kon niet worden gedeserialiseerd
                    instance: /api/v1/datasets
                    code: DCAT_DATASET_DESERIALIZATION_FAILED
        "401":
          description: Geen geldige sessiecookie of bearer-token. Geen response body.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
        "403":
          description: "De rol User of Admin ontbreekt (geen response body), of de\
            \ dataset hoort bij een andere organisatie."
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "404":
          description: Een resource uit het pad bestaat niet. 'code' geeft aan welke.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "409":
          description: Er bestaat al een dataset met dezelfde dctIdentifier.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
              examples:
                DatasetBestaatAl:
                  summary: Dubbele dctIdentifier
                  description: DatasetBestaatAl
                  value:
                    type: urn:datastore:problem:dcat-dataset-already-exists
                    title: DCAT-dataset bestaat al
                    status: 409
                    detail: Er bestaat al een dataset met dezelfde dctIdentifier
                    instance: /api/v1/datasets
                    code: DCAT_DATASET_ALREADY_EXISTS
        "500":
          description: Een onverwachte fout aan serverzijde; 'code' is INTERNAL_ERROR.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
      security:
      - sessionCookie: []
      - bearerAuth: []
    delete:
      tags:
      - DCAT-datasets
      summary: Verwijder een opgeslagen DCAT-dataset
      description: Markeert de opgeslagen DCAT-dataset als verwijderd.
      operationId: deleteDcatDataset
      parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: De dataset is als verwijderd gemarkeerd.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
        "401":
          description: Geen geldige sessiecookie of bearer-token. Geen response body.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
        "403":
          description: "De rol User of Admin ontbreekt (geen response body), of de\
            \ dataset hoort bij een andere organisatie."
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "404":
          description: Een resource uit het pad bestaat niet. 'code' geeft aan welke.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "500":
          description: Een onverwachte fout aan serverzijde; 'code' is INTERNAL_ERROR.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
      security:
      - sessionCookie: []
      - bearerAuth: []
    patch:
      tags:
      - DCAT-datasets
      summary: Werk een opgeslagen DCAT-dataset gedeeltelijk bij
      description: Past alleen de meegestuurde velden aan. Daarna controleert de API
        de hele dataset.
      operationId: patchDcatDataset
      parameters:
      - name: datasetId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Gedeeltelijke DCAT-datasetpayload met alleen de velden die aangepast
          moeten worden.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DcatDataset"
            examples:
              DeelupdateRequestPayload:
                description: DeelupdateRequestPayload
                value:
                  dcatVersion: 1.2.1
                  admsVersionNotes:
                  - Metadata field alignment with May 2026 profile.
                  dcatContactPoint:
                    vcardFn: Erasmuspark Open Data Team
        required: true
      responses:
        "200":
          description: De dataset is bijgewerkt.
          headers:
            API-Version:
              description: Volledige API-versie volgens semver.
              schema:
                type: string
                example: 0.9.0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DcatDatasetStoredResponse"
        "400":
